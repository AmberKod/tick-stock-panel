[project]
name = "tickflow-stock-panel-backend"
version = "0.2.1"
description = "A 股选股 + 监控 + 回测面板 — TickFlow 适配"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
    # Data
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",                # 仅在 BacktestService 边界使用,见 §7.4 / ADR-19
    "psutil>=5.9",                # 独立回测 worker 的峰值 RSS 与退出后内存指标
    # llvmlite 不再提供 macOS Intel wheel；该平台使用 Matrix 纯 Python fallback。
    "numba>=0.65.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "fastexcel>=0.10",            # Polars 读取 xlsx/xls
    "pypinyin>=0.50",             # 股票名拼音首字母搜索 (同花顺式 payh → 平安银行)
    # TickFlow 官方 SDK
    "tickflow[all]>=0.1.23",
    # Scheduling
    "apscheduler>=3.10",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # AI(可选,但默认装上)
    "openai>=1.40",               # OpenAI 兼容适配器复用 openai SDK
    "httpx>=0.27",
    "platformdirs>=4.0",          # 桌面版用户数据目录 (跨平台持久可写)
    "winotify>=1.1; sys_platform == 'win32'",  # Windows 系统通知 (进操作中心)
    "plyer>=2.1",                 # 系统通知跨平台兜底 (macOS/Linux)
    # Watchlist screenshot OCR (Tesseract)
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Legacy CPU runtime: install the Polars compatibility kernel on
# machines without AVX2/FMA support.
# Enable with: uv sync --extra legacy-cpu
legacy-cpu = [
    "polars[rtcompat]>=1.0",
]

# vectorbt 还会引入绘图、交互组件等完整分析栈，仍保持为可选 extras。
# Matrix 引擎只直接依赖上面的 numba/llvmlite 编译内核。
# 启用:`uv sync --extra backtest`
backtest = [
    "vectorbt>=0.26",
]

# 桌面客户端依赖: pywebview 桌面窗口。打包用 (PyInstaller), 生产/Docker 不需要。
# 启用:`uv sync --extra desktop`
desktop = [
    "pywebview>=5.0",
]

# 港股/美股多市场数据源 (M1 港股 + 后续美股)
# 启用:`uv sync --extra multi-market`, 或在用户机器上 `pip install akshare yfinance`
# 注: 保持可选 extra, 因为部分离线/Docker 部署不需要这层依赖
multi-market = [
    "akshare>=1.12",
    "yfinance>=0.2.30",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# 长行交给 fmt; RUF001/2/3 针对英文代码库的 homoglyph 混淆攻击, 对中文
# 项目 (运行时文案/docstring/注释大量使用全角标点) 是纯误报 —— 09-17 实测
# 779 处全是中文标点。豁免后剩余违规才有工程意义。
# 其余豁免均为惯例冲突而非缺陷 (09-17 batch-3 逐类人工判定):
# - SIM102: 嵌套 if 是带注释分层的可读性写法, 合并降低可读性;
# - E402/N806/N815: 历史代码的晚导入与函数内大写常量惯例 (BATCH/_SENTINEL);
# - RUF012: 市场 profile/档位表类属性 dict 是只读配置, 无 mutation 路径;
# - SIM105/108/113/117: 风格偏好, 现写法更直白。
ignore = [
    "E501", "RUF001", "RUF002", "RUF003",
    "SIM102", "SIM105", "SIM108", "SIM113", "SIM117",
    "E402", "N806", "N815", "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI Query default 在路由参数声明处求值是框架签名约定, 所有 api/
# 路由文件统一豁免 B008, 不改业务代码迁就 lint。
"app/api/*.py" = ["B008"]
# B023 (loop-variable binding): 两处闭包均在同一次迭代内立即调用不逃逸
# (engine._scheduled_reason / kline_sync.fetch 经 _fetch_batch_with_timeout),
# 代码内有注释说明; 行级 noqa 挡不住函数体内的循环变量引用。
"app/backtest/engine.py" = ["B023"]
"app/services/kline_sync.py" = ["B023"]
# N801 (类名应 CapWords): 测试桩用嵌套类模拟 repo.store 这类生产属性, 类名必须
# 与属性名逐字一致(小写), 改大写会让桩对象失去 store 属性而测试全崩。
"tests/**" = ["N801"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
